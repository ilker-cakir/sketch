<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sketch Inspect Example</title>
    <style>
      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      button {
        border: 0;
        border-radius: 6px;
        background: #10b981;
        color: #031712;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 10px 14px;
      }
      button + button {
        margin-left: 8px;
      }
      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      pre {
        background: #030712;
        border: 1px solid #374151;
        border-radius: 6px;
        overflow: auto;
        padding: 16px;
      }
      a {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sketch Inspect Example</h1>
      <p>
        This page opens <a href="http://127.0.0.1:3000/inspect" target="xstateinspector">Sketch /inspect</a>
        and sends live XState inspection events.
      </p>
      <p>
        <button id="toggle">Send TOGGLE</button>
        <button id="reset">Reset actor</button>
      </p>
      <pre id="snapshot"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
